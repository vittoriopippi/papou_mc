name: PapouHud
version: '${version}'
main: com.giulio.papouhud.paper.PapouHudPaper
api-version: '1.21.8'
description: Papou HUD on Paper. Sends every player's health, armor and position, and the XP stored in the furnace they open, to players with the Papou HUD mod, and shows friend bars to everyone else (Bedrock players too).
authors: [Giulio]
commands:
  papou:
    description: Shows or hides the friend bars at the top of the screen.
    usage: /papou
